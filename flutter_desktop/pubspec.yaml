name: deepcool_desktop_app
description: Flutter desktop app for DeepCool Digital CPU/GPU monitor UI
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  deepcool_digital_dart:
    path: ..
  fl_chart: ^1.3.1
  material_ui: ^1.11.1
  tray_manager: ^0.9.1
  url_launcher: ^6.3.3
  window_manager: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/support_me_on_kofi_beige.png
